name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # 1. Deploy Hono Server
      - name: Deploy Hono Server
        id: deploy-server
        run: |
          cd apps/server
          bun run build
          npx wrangler publish --env preview-pr-${{ github.event.pull_request.number }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # 2. Extract Cloudflare Preview URL
      - name: Set Server URL
        run: echo "SERVER_URL=https://pr-${{ github.event.pull_request.number }}.myapp.workers.dev" >> $GITHUB_ENV

      # 3. Build Admin React App
      - name: Build Admin App
        run: |
          cd apps/admin
          echo "VITE_API_URL=${{ env.SERVER_URL }}" > .env
          bun run build

      # 4. Deploy Admin to Netlify
      - name: Deploy Admin to Netlify
        id: deploy-admin
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./apps/admin/dist
          production-deploy: false
          deploy-message: "PR #${{ github.event.pull_request.number }} preview"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}

      # 5. Comment PR
      - name: Comment PR with preview links
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 Preview for this PR is live:
            - Admin Panel (React): ${{ steps.deploy-admin.outputs.deploy-url }}
            - Hono Server (Worker): https://pr-${{ github.event.pull_request.number }}.myapp.workers.dev
