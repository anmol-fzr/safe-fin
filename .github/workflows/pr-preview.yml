name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required for commenting on the PR

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # 1. Deploy Hono Server & Capture URL
      - name: Deploy Hono Server
        id: deploy-server # Give the step an ID to reference its outputs
        run: |
          cd apps/server
          # Deploy using the 'preview' env config but with a unique name for this PR.
          # Then, capture the output, find the URL, and save it as a step output.
          DEPLOY_OUTPUT=$(npx wrangler deploy --env preview --name myapp-pr-${{ github.event.pull_request.number }})
          echo "DEPLOY_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$DEPLOY_OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*workers.dev')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # 2. Build Admin React App (using the captured URL)
      - name: Build Admin App
        run: |
          cd apps/admin
          echo "VITE_PUBLIC_SERVER_URL=${{ steps.deploy-server.outputs.url }}" > .env
          echo "Built with server URL: ${{ steps.deploy-server.outputs.url }}"
          bun run build

      # 3. Deploy Admin to Netlify
      - name: Deploy Admin to Netlify
        id: deploy-admin
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./apps/admin/dist
          production-deploy: false
          deploy-message: "PR #${{ github.event.pull_request.number }} preview"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}

      # 4. Comment on PR with the live URLs
      - name: Comment PR with preview links
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 **Preview for this PR is live!**

            - **Admin Panel (React):** ${{ steps.deploy-admin.outputs.deploy-url }}
            - **Hono Server (Worker):** ${{ steps.deploy-server.outputs.url }}
