name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  pull-requests: read
  statuses: write

jobs:
  preview_server:
    runs-on: ubuntu-latest
    name: Deploy Server
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}

