name: Deploy Full App to Production

on:
  release:
    types: [published]

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

        # 1. Deploy Hono Server (Production)
      - name: Deploy Hono Server
        id: deploy-server
        working-directory: apps/server
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: publish --env production

          # Extract Production Server URL (depends on your Cloudflare Worker route)
      - name: Set Server URL
        id: set-server-url
        run: echo "SERVER_URL=https://api.myapp.com" >> $GITHUB_ENV

        # 2. Build and Deploy Admin React App to Netlify (Production)
      - name: Build Admin App
        working-directory: apps/admin
        run: |
          echo "VITE_PUBLIC_SERVER_URL=${{ env.SERVER_URL }}" > .env
          echo "VITE_PUBLIC_POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "VITE_PUBLIC_POSTHOG_HOST=${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}" >> .env
          bun run build

      - name: Deploy Admin to Netlify
        id: deploy-admin
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./apps/admin/dist
          production-deploy: true
          deploy-message: "Release ${{ github.event.release.tag_name }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}

          # 3. Release summary comment
      - name: Comment Release URLs
        uses: softprops/action-gh-release@v2
        with:
          body: |
            🚀 Production Release ${{ github.event.release.tag_name }} deployed!
      - Admin Panel: https://your-netlify-site.netlify.app
      - API Server: https://api.myapp.com
