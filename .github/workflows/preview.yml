name: Preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  preview_server:
    runs-on: ubuntu-latest
    name: Deploy Server
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'Safe Fin Staging' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with: 
          bun-version: 1.2.23

      - name: Install Dependencies
        run: bun install

      - name: Deploy to Cloudflare (Preview)
        uses: cloudflare/wrangler-action@v3
        with:
          packageManager: bun
          wranglerVersion: "4.40.3"
          workingDirectory: ./apps/server/ 
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: versions upload --preview-alias ${{ github.event.pull_request.number }} --env preview
